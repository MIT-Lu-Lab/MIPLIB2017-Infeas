name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_manifest: ${{ steps.release.outputs.manifest }}
    permissions:
      contents: read
      pages: read
    # Supersede an obsolete check, but do not cancel a deployment that has
    # already started in the separate `pages` concurrency group below.
    concurrency:
      group: site-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Carry the one configured release into the deployment gate
        id: release
        run: |
          . .github/release.env
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "manifest=$RELEASE_MANIFEST" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          # the version the deployment gate and a checkout run; testing any
          # other would prove nothing about the build that actually ships
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # the list itself lives in pyproject.toml, so a checkout installs what
      # CI installs rather than the two drifting apart
      - run: pip install --group dev

      - name: Lint
        run: ruff check .

      # layout is the formatter's, so a hand-wrapped line fails here rather
      # than being argued about in review
      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: pyright

      - name: Test
        shell: bash            # for pipefail; the default run shell has none
        run: |
          pytest -q -rs | tee /tmp/pytest.out
          # a skip here means the runner is missing something the tests need, and
          # the check it guards silently stops running. The schema tests skip
          # without jsonschema and the font tests without fontTools, which is
          # exactly how that would go unnoticed.
          if grep -q "SKIPPED" /tmp/pytest.out; then
            echo "::error::a test skipped in CI; install what it needs"; exit 1
          fi

      - name: Execute the browser-independent filter logic
        run: node tests/js/browse.test.js

      - name: Resolve the published URL
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build the site
        run: |
          python -m website.build --out-dir _site \
            --release-base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}" \
            --site-url "${{ steps.pages.outputs.base_url || 'https://example.invalid/probe' }}"

      - name: Check the production public URL
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if grep -rIEn 'https://example\.invalid/probe' _site \
               --include='*.html' --include='*.xml'; then
            echo "::error::the Pages artifact contains a placeholder public URL"
            exit 1
          fi

      - name: Upload the verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
          retention-days: 1

  release-gate:
    needs: check
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' }}
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.check.outputs.release_tag }}
      manifest: ${{ needs.check.outputs.release_manifest }}

  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
