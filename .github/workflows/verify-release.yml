name: Verify the release

# The site derives every download link from one release prefix, so an asset that
# is renamed, removed or re-uploaded becomes a dead link on a page that still
# claims the file is there. Nothing in a normal build would notice.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check
        default: v1.0
  schedule:
    # monthly, so a link that rotted between releases surfaces on its own
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the release against the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/verify_release_assets.py \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag || 'v1.0' }}"
