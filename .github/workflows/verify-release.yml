name: Verify the release

# The site derives every download link from one release prefix, so an asset that
# is renamed, removed or re-uploaded becomes a dead link on a page that still
# claims the file is there. Nothing in a normal build would notice.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to check
        required: true
        type: string
      manifest:
        description: Repository path to a versioned release manifest; empty only for legacy v1.0
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check; empty uses .github/release.env
        required: false
        type: string
      manifest:
        description: Repository path to a versioned release manifest (post-v1.0)
        required: false
        type: string
  schedule:
    # monthly, so a link that rotted between releases surfaces on its own
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --group contracts
      - name: Compare the release against the index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          . .github/release.env
          if [[ -n "$INPUT_TAG" ]]; then
            RELEASE_TAG="$INPUT_TAG"
            RELEASE_MANIFEST="$INPUT_MANIFEST"
          elif [[ -n "$INPUT_MANIFEST" ]]; then
            RELEASE_MANIFEST="$INPUT_MANIFEST"
          fi
          args=(--repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG")
          if [[ -n "$RELEASE_MANIFEST" ]]; then
            args+=(--manifest "$RELEASE_MANIFEST")
          fi
          python -m scripts.verify_release_assets "${args[@]}"
