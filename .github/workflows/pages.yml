name: Deploy the site

# This workflow has no independent trigger. CI calls it only after its `check`
# job has built, verified and uploaded the one artifact deployed below.
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # A queued deploy waits for the running one. Never interrupt a publication
    # halfway through because a newer commit reached this gate.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
